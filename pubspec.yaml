name: cvio
description: A new Flutter project.

environment:
  sdk: ">=3.3.2 <4.0.0"

version: 1.0.0+1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ルート
  go_router: ^14.6.3
  intl: ^0.19.0

  # HTTPリクエスト
  http: ^1.2.2

  # 状態管理
  provider: ^6.1.2
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1

  # データベース
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  encrypt: ^5.0.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  #  # Firebase
  #  firebase_core: ^3.9.0
  #  firebase_auth: ^5.3.4
  #  cloud_firestore: ^5.6.0
  #  firebase_storage: ^12.3.7

  # UI/UX（iOSライクなパッケージ）
  cupertino_icons: ^1.0.8
  flutter_slidable: ^3.1.2
  flutter_svg: ^2.0.16
  modal_bottom_sheet: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  pull_to_refresh: ^2.0.0
  custom_sliding_segmented_control: ^1.8.5
  image_picker: ^1.1.2
  file_picker: ^9.2.1

  # アニメーションとトランジション
  animations: ^2.0.11
  lottie: ^3.3.0

  # PDF
  flutter_pdfview: ^1.0.0
  pdf: ^3.6.0
  syncfusion_flutter_pdf: ^29.1.38
  share_plus: ^10.1.4

  # その他
  uuid: ^4.5.1
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # コード生成関連
  build_runner: ^2.4.14
  json_serializable: ^6.9.2
  freezed: ^3.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/pdf/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700

