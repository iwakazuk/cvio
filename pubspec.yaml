name: cvio
description: A new Flutter project.

environment:
  sdk: ">=3.3.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTPリクエスト
  http: ^1.2.2

  # 状態管理
  provider: ^6.1.2
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1

  # データベース
  sqflite: ^2.4.1
  path_provider: ^2.1.5

#  # Firebase
#  firebase_core: ^3.9.0
#  firebase_auth: ^5.3.4
#  cloud_firestore: ^5.6.0
#  firebase_storage: ^12.3.7

  # UI/UX（iOSライクなパッケージ）
  cupertino_icons: ^1.0.8
  flutter_slidable: ^3.1.2
  flutter_svg: ^2.0.16
  modal_bottom_sheet: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  pull_to_refresh: ^2.0.0

  # アニメーションとトランジション
  animations: ^2.0.11
  lottie: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # コード生成関連
  build_runner: ^2.4.14
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true

