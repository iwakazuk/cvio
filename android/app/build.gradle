plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def signingPath = System.getenv("ANDROID_KEYSTORE_PATH")
def signingPassword = System.getenv("ANDROID_STORE_PASSWORD")
def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def signingAlias = System.getenv("ANDROID_KEY_ALIAS")
def hasReleaseSigning = signingPath && signingPassword && signingKeyPassword && signingAlias

// Never silently sign release APKs with an ephemeral debug key.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains("release")
    }
    if (releaseRequested && !hasReleaseSigning) {
        throw new GradleException("Release signing is not configured. See docs/android-build.md.")
    }
}

android {
    namespace = "com.example.cvio"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.cvio"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(signingPath)
                storeType = "PKCS12"
                storePassword = signingPassword
                keyAlias = signingAlias
                keyPassword = signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
