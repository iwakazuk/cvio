name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      enable_drive:
        description: Include Google Drive login (requires OAuth client ID)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check configuration before installing build tools
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENABLE_DRIVE: ${{ inputs.enable_drive }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android signing secret: $name. See docs/android-build.md."
              exit 1
            fi
          done
          if [[ "$ENABLE_DRIVE" == 'true' && -z "$GOOGLE_SERVER_CLIENT_ID" ]]; then
            echo '::error::Set the GOOGLE_SERVER_CLIENT_ID repository variable first.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: false

      - name: Resolve dependencies and generate models
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cvio-signing.p12"
          test -s "$RUNNER_TEMP/cvio-signing.p12"

      - name: Build signed APK for AQUOS wish4
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cvio-signing.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENABLE_DRIVE: ${{ inputs.enable_drive }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          args=(--release --target-platform android-arm64 --build-number "$GITHUB_RUN_NUMBER")
          if [[ "$ENABLE_DRIVE" == 'true' ]]; then
            args+=("--dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID")
          fi
          flutter build apk "${args[@]}"

      - name: Verify APK signature and record public certificate fingerprints
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cvio-signing.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/cvio-arm64.apk
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs artifacts/cvio-arm64.apk > artifacts/apk-signature.txt
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > artifacts/signing-certificate.txt
          cp pubspec.lock artifacts/pubspec.lock
          (cd artifacts && sha256sum cvio-arm64.apk > SHA256SUMS)
          {
            echo '### APK build complete'
            echo '- Download the APK artifact within 3 days.'
            echo '- Android package: com.example.cvio'
            echo '- Use the SHA-1 in signing-certificate.txt for the Android OAuth client.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save APK for 3 days
        uses: actions/upload-artifact@v7
        with:
          name: cvio-apk-${{ github.run_number }}
          path: artifacts/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cvio-signing.p12"
